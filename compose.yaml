services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "descobuddy", "health"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
volumes:
  bot-data:
