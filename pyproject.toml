[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "descobuddy"
version = "0.1.0"
description = "Private Telegram DESCO consumption and recharge ledger"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]==22.8",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "python-dotenv==1.2.4",
  "filelock==4.0.9",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[project.scripts]
descobuddy = "descobuddy.__main__:main"

[tool.setuptools.packages.find]
include = ["descobuddy*"]

[tool.setuptools.package-data]
descobuddy = ["certs/*.pem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
